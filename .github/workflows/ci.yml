name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: support_tickets_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d support_tickets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy values for CI only — nothing here is a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/support_tickets_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/support_tickets_test?schema=public
      JWT_SECRET: ci-secret-value-that-is-long-enough
      BUSINESS_TIMEZONE: Asia/Kolkata
      BUSINESS_START_HOUR: '9'
      BUSINESS_END_HOUR: '18'
      AGENT_SIGNUP_CODE: ci-agent-code
      PORT: '4000'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Generate GraphQL types
        # src/generated is gitignored, so the types must be built before tsc runs.
        run: bun run codegen

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Test (unit and integration)
        run: bun run test
